spring.application.name=springboot-password-manager

server.port=5001

# MongoDB
spring.mongodb.uri=mongodb://localhost:27017/odenDB
logging.level.org.springframework.data.mongodb.core=DEBUG

# JWT
jwt.secret=change-this-to-a-long-random-string-at-least-256-bits-for-hs256
jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.web=INFO
spring.mvc.log-request-details=true

spring.web.error.include-message=always
server.web.error.include-binding-errors=always
server.web.error.include-exception=true